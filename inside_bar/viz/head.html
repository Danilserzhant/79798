<title>Шорты ETH из H4 FVG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: шапка с легендой, ряд выбора ситуаций по группам, сводка, сетка 2×2 графиков W / D1 / H4 / M15 */
:root{
  --bg:#f2f4f6; --panel:#ffffff; --ink:#111820; --ink2:#4b5663; --muted:#7c8794; --line:#dde2e8; --grid:#eceff3;
  --up:#16866b; --down:#c8433a; --mother:#1d2a38; --ib:#8a94a0; --zone:#c47f0a; --entry:#2a6fd6; --stop:#c8433a; --sweep:#7a4fc9; --target:#16866b;
  --chip:#e8ecf0; --chipOn:#1d2a38; --chipOnInk:#ffffff;
  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0d1116; --panel:#141a21; --ink:#e9eef3; --ink2:#aab4bf; --muted:#7f8a96; --line:#262f39; --grid:#1b222a;
  --up:#2fb391; --down:#e2655b; --mother:#dfe6ee; --ib:#7f8a96; --zone:#e3a53a; --entry:#5b9cf0; --stop:#e2655b; --sweep:#a786e8; --target:#2fb391;
  --chip:#1c242d; --chipOn:#dfe6ee; --chipOnInk:#0d1116;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0d1116; --panel:#141a21; --ink:#e9eef3; --ink2:#aab4bf; --muted:#7f8a96; --line:#262f39; --grid:#1b222a;
  --up:#2fb391; --down:#e2655b; --mother:#dfe6ee; --ib:#7f8a96; --zone:#e3a53a; --entry:#5b9cf0; --stop:#e2655b; --sweep:#a786e8; --target:#2fb391;
  --chip:#1c242d; --chipOn:#dfe6ee; --chipOnInk:#0d1116;}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);padding-inline:16px;padding-block:28px 56px}
main{max-width:1240px;margin:0 auto;display:grid;gap:22px}
header{display:grid;gap:8px}
.eyebrow{font:500 12px var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(26px,4vw,38px);line-height:1.1;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
p{margin:0;color:var(--ink2);max-width:72ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid}
.legend i.dash{border-top-style:dashed}
.groups{display:grid;gap:12px}
.group{display:grid;gap:6px}
.group h2{margin:0;font:600 12px var(--m);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 13px var(--m);padding:6px 10px;border-radius:6px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--muted)}
.chip:focus-visible{outline:2px solid var(--entry);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn)}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;font-weight:600}
.tag.stop{background:color-mix(in srgb,var(--stop) 18%,transparent);color:var(--stop)}
.tag.win{background:color-mix(in srgb,var(--target) 18%,transparent);color:var(--target)}
.tag.now{background:color-mix(in srgb,var(--zone) 20%,transparent);color:var(--zone)}
.chip[aria-pressed="true"] .tag{background:transparent;color:inherit;border:1px solid currentColor}
.summary{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:baseline;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:12px}
.summary .k{font:500 11px var(--m);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.summary .v{font:600 16px var(--m);font-variant-numeric:tabular-nums}
.summary .note{flex:1 1 320px;min-width:0;color:var(--ink2);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 10px 6px;display:grid;gap:6px;min-width:0}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3{margin:0;font:600 14px var(--m)}
.card small{color:var(--muted);font-size:12px}
.chart{height:340px;width:100%}
.foot{font-size:13px;color:var(--muted)}
.flt{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--ink2);cursor:pointer}
.flt input{width:16px;height:16px;accent-color:var(--entry)}
</style>
